<style>
:root{--bg:#060a13;--bg2:#0c1220;--bg3:#131b2e;--border:#1e2d4a;--text:#e4eaf6;--muted:#7a8bb5;--primary:#00ddb3;--primary-dim:rgba(0,221,179,.12);--accent:#ff5733;--accent-dim:rgba(255,87,51,.12);--gold:#ffc107;--success:#10b981;--error:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh}h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.grid-bg{background-image:linear-gradient(rgba(0,221,179,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,221,179,.03) 1px,transparent 1px);background-size:40px 40px}
.glass{background:rgba(12,18,32,.7);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;transition:all .3s}.glass:hover{border-color:rgba(0,221,179,.3);box-shadow:0 0 30px rgba(0,221,179,.06)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#00b896);color:#060a13;font-weight:700;border:none;border-radius:12px;padding:12px 28px;cursor:pointer;font-size:.95rem;transition:all .3s;font-family:'Space Grotesk',sans-serif}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,221,179,.3)}
.btn-secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:12px;padding:10px 24px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .3s;font-family:'Space Grotesk',sans-serif}.btn-secondary:hover{background:var(--primary-dim);transform:translateY(-1px)}
.input-field{width:100%;padding:14px 18px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:.95rem;outline:none;transition:all .3s;font-family:'DM Sans',sans-serif}.input-field:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim)}.input-field::placeholder{color:var(--muted)}
.sidebar{width:260px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;z-index:50;transition:transform .3s}.sidebar-link{display:flex;align-items:center;gap:14px;padding:13px 24px;color:var(--muted);cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:.95rem}.sidebar-link:hover{color:var(--text);background:rgba(0,221,179,.05)}.sidebar-link.active{color:var(--primary);background:var(--primary-dim);border-left-color:var(--primary);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}.badge-debutant{background:rgba(16,185,129,.15);color:#10b981}.badge-intermediaire{background:rgba(255,193,7,.15);color:#ffc107}.badge-avance{background:rgba(255,87,51,.15);color:#ff5733}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#00b896);border-radius:3px;transition:width .6s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px rgba(0,221,179,.15)}50%{box-shadow:0 0 30px rgba(0,221,179,.3)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.animate-in{animation:fadeInUp .5s ease both}.animate-in-delay{animation:fadeInUp .5s ease .15s both}.animate-in-delay2{animation:fadeInUp .5s ease .3s both}.float-anim{animation:float 4s ease-in-out infinite}
.toast{position:fixed;bottom:24px;right:24px;padding:16px 24px;border-radius:12px;color:#fff;font-weight:500;z-index:9999;animation:fadeInUp .3s ease;max-width:400px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}.toast-success{background:linear-gradient(135deg,#059669,#10b981)}.toast-error{background:linear-gradient(135deg,#dc2626,#ef4444)}.toast-info{background:linear-gradient(135deg,#0284c7,#0ea5e9)}
.quiz-option{padding:16px 20px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:14px}.quiz-option:hover{border-color:var(--primary);background:var(--primary-dim)}.quiz-option.selected{border-color:var(--primary);background:var(--primary-dim)}.quiz-option.correct{border-color:var(--success);background:rgba(16,185,129,.12)}.quiz-option.wrong{border-color:var(--error);background:rgba(239,68,68,.12)}.quiz-option .circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s}.quiz-option.selected .circle{border-color:var(--primary);background:var(--primary)}.quiz-option.correct .circle{border-color:var(--success);background:var(--success)}.quiz-option.wrong .circle{border-color:var(--error);background:var(--error)}
.lesson-item{padding:14px 18px;border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;border:1px solid transparent}.lesson-item:hover{background:rgba(0,221,179,.05);border-color:var(--border)}.lesson-item.active{background:var(--primary-dim);border-color:rgba(0,221,179,.3)}
.video-container{background:#000;border-radius:14px;aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid var(--border)}.video-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tab-btn{padding:10px 20px;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;background:transparent;color:var(--muted);border:1px solid transparent}.tab-btn:hover{color:var(--text)}.tab-btn.active{background:var(--primary-dim);color:var(--primary);border-color:rgba(0,221,179,.3)}
.stat-card{position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:12px;cursor:pointer;font-size:.95rem;font-weight:500;transition:all .25s;font-family:'DM Sans',sans-serif}.btn-google:hover{background:#f8f9fa;box-shadow:0 2px 12px rgba(0,0,0,.12);transform:translateY(-1px)}
.google-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:9000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}.google-modal{background:#fff;border-radius:16px;width:100%;max-width:450px;box-shadow:0 24px 80px rgba(0,0,0,.4);overflow:hidden;animation:fadeInUp .35s ease}.google-modal-header{padding:32px 32px 8px;text-align:center}.google-modal-body{padding:8px 32px 32px}.google-input{width:100%;padding:14px 16px;border:1.5px solid #dadce0;border-radius:8px;color:#202124;font-size:1rem;outline:none;transition:all .2s;font-family:'DM Sans',sans-serif;background:#fff}.google-input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.15)}.google-btn-primary{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:.95rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}.google-btn-primary:hover{background:#1557b0}.google-btn-secondary{background:transparent;color:#1a73e8;border:none;border-radius:8px;padding:12px 28px;font-size:.95rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}.google-btn-secondary:hover{background:#e8f0fe}.google-spinner{width:20px;height:20px;border:2.5px solid #e0e0e0;border-top-color:#1a73e8;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}@media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.mobile-open{transform:translateX(0)}.main-content{margin-left:0!important}}

<script>
const COURSES=[
  {id:1,title:"Architecture et Composants d'un PC",category:"fondamentaux",level:"Débutant",duration:"4h30",rating:4.9,students:3421,icon:"fa-microchip",color:"#00ddb3",
   description:"Plongez dans les entrailles d'un ordinateur. Comprenez le rôle du processeur, de la mémoire vive, des cartes mères et du stockage pour maîtriser les fondations du numérique.",
   image:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"L'Architecture de Von Neumann",duration:"22 min",type:"video",videoId:"VCW2Axi6XSc",content:"L'architecture de <strong>Von Neumann</strong> est le modèle fondamental de la plupart des ordinateurs modernes. Elle repose sur le principe du <strong>programme stocké</strong> : les instructions et les données résident dans la même mémoire. Les composants clés sont l'<strong>Unité Arithmétique et Logique</strong> (UAL) qui effectue les calculs, l'<strong>Unité de Commande</strong> qui pilote les opérations, la <strong>Mémoire Centrale</strong>, et les <strong>Entrées/Sorties</strong>. Le bus système assure la communication entre ces éléments. Ce modèle, bien que constamment amélioré, reste la base de la compréhension informatique."},
     {id:2,title:"Le Processeur (CPU) et ses cœurs",duration:"25 min",type:"video",videoId:"z80inke28CM",content:"Le <strong>CPU</strong> (Central Processing Unit) est le cerveau de la machine. Il exécute les instructions logiques et arithmétiques. Un processeur moderne contient plusieurs <strong>cœurs</strong> (dual-core, quad-core, etc.), permettant d'exécuter plusieurs tâches simultanément (multithreading). La <strong>fréquence</strong> (mesurée en GHz) détermine le nombre de cycles par seconde. Le <strong>cache L1/L2/L3</strong> est une mémoire ultra-rapide intégrée au processeur pour réduire les temps d'accès à la RAM. Les fondeurs principaux sont Intel et AMD."},
     {id:3,title:"Mémoire RAM et Stockage (HDD/SSD)",duration:"20 min",type:"text",content:"La <strong>RAM</strong> (Random Access Memory) est la mémoire de travail volatile du PC. Elle stocke temporairement les données des programmes en cours d'exécution pour y accéder très rapidement. Contrairement au stockage permanent, elle s'efface à l'extinction. Les <strong>barrettes DDR4/DDR5</strong> sont les standards actuels. Le <strong>stockage</strong> conserve les données de façon permanente. Les <strong>SSD</strong> (Solid State Drive), utilisant de la mémoire flash, sont de 5 à 20 fois plus rapides que les <strong>HDD</strong> (Hard Disk Drive) mécaniques, transformant la réactivité du système."},
     {id:4,title:"Carte Mère, GPU et Alimentation",duration:"28 min",type:"video",videoId:"geBcfKn3B1g",content:"La <strong>carte mère</strong> est la colonne vertébrale interconnectant tous les composants (CPU, RAM, GPU, stockage) via des bus (PCIe, SATA). Le <strong>GPU</strong> (Graphics Processing Unit) spécialisé dans l'affichage et les calculs parallèles, est vital pour le jeu vidéo et l'IA (NVIDIA, AMD). L'<strong>alimentation</strong> (PSU) convertit le courant alternatif en courant continu stable pour alimenter l'ensemble. Sa puissance (en Watts) doit correspondre aux besoins du système pour éviter les instabilités."}
   ],
   quiz:[
     {question:"Quel principe fondamental définit l'architecture de Von Neumann ?",options:["La séparation stricte des données et du code","Le programme stocké en mémoire","L'utilisation exclusive de transistors","Le traitement quantique"],correct:1,explanation:"L'architecture de Von Neumann repose sur le principe du programme stocké : instructions et données partagent la même mémoire."},
     {question:"Quelle est la principale différence entre la RAM et un SSD ?",options:["La RAM est plus lente","Le SSD est volatile","La RAM est volatile et le SSD est persistant","Le SSD stocke les calculs"],correct:2,explanation:"La RAM est volatile (perd ses données sans courant) et ultra-rapide, tandis que le SSD est persistant (conserve les données) mais plus lent."},
     {question:"À quoi sert le cache L3 dans un processeur ?",options:["À stocker le système d'exploitation","À réduire le temps d'accès à la RAM","À refroidir le CPU","À gérer l'alimentation"],correct:1,explanation:"Le cache L3 est une mémoire ultra-rapide dans le CPU qui stocke les données fréquemment utilisées pour éviter d'aller chercher en RAM (plus lente)."},
     {question:"Quel composant est spécialisé dans les calculs graphiques et parallèles ?",options:["Le CPU","Le GPU","Le HDD","La carte réseau"],correct:1,explanation:"Le GPU (Graphics Processing Unit) possède des milliers de petits cœurs optimisés pour les calculs parallèles, idéal pour les graphismes et l'IA."}
   ]},
  {id:2,title:"Initiation à la Programmation Python",category:"programmation",level:"Débutant",duration:"6h00",rating:4.8,students:5210,icon:"fa-code",color:"#ff5733",
   description:"Apprenez les bases de l'algorithmique et du langage Python : variables, conditions, boucles et fonctions. Le point de départ idéal pour créer vos propres programmes.",
   image:"https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"Logique Algorithmique et Pseudo-code",duration:"20 min",type:"video",videoId:"9jRPK9tqMmI",content:"Un <strong>algorithme</strong> est une suite finie, non ambiguë et effective d'opérations pour résoudre un problème. Avant de coder, on utilise le <strong>pseudo-code</strong> pour décrire la logique en langage naturel. Les structures de base sont la <strong>séquence</strong> (exécution pas à pas), la <strong>sélection</strong> (SI... ALORS... SINON) et l'<strong>itération</strong> (POUR, TANT QUE). Un bon algorithme doit être correct, lisible et efficace en termes de complexité temporelle."},
     {id:2,title:"Variables, Types et Opérateurs en Python",duration:"25 min",type:"text",content:"En Python, une <strong>variable</strong> est une étiquette pointant vers une valeur en mémoire. Les types fondamentaux sont : <strong>int</strong> (entier), <strong>float</strong> (décimal), <strong>str</strong> (chaîne de caractères), <strong>bool</strong> (True/False). Python est dynamiquement typé : pas besoin de déclarer le type. Les opérateurs arithmétiques (+, -, *, /, //, %), de comparaison (==, !=, >) et logiques (and, or, not) permettent de manipuler ces données. Exemple : age = 25; nom = 'Alice'."},
     {id:3,title:"Structures de Contrôle (If, For, While)",duration:"30 min",type:"video",videoId:"x_Jeyvw7n9I",content:"Les structures de contrôle dirigent le flux d'exécution. L'instruction <strong>if/elif/else</strong> permet l'exécution conditionnelle. La boucle <strong>for</strong> itère sur une séquence (ex: for i in range(10)). La boucle <strong>while</strong> répète un bloc tant qu'une condition est vraie. L'indentation stricte en Python délimite les blocs de code. Attention aux boucles infinies avec while : assurez-vous que la condition puisse devenir fausse."},
     {id:4,title:"Fonctions et Modularité",duration:"28 min",type:"text",content:"Une <strong>fonction</strong> regroupe des instructions sous un nom réutilisable. Définie par <strong>def</strong>, elle peut recevoir des <strong>paramètres</strong> et <strong>retourner</strong> une valeur via <strong>return</strong>. Exemple : def calculer_aire(largeur, hauteur): return largeur * hauteur. Les fonctions favorisent la <strong>modularité</strong>, évitent la répétition (principe DRY) et facilitent le débogage. La portée des variables (locale vs globale) est essentielle à maîtriser."},
     {id:5,title:"Listes et Structures de Données Basiques",duration:"25 min",type:"video",videoId:"5UOSiCPu5aM",content:"Les <strong>listes</strong> Python sont des collections ordonnées et modifiables : fruits = ['pomme', 'banane']. On accède aux éléments par leur <strong>index</strong> (commençant à 0). Les opérations courantes incluent .append(), .remove(), len(), et le <strong>slicing</strong> (fruits[1:3]). Les <strong>tuples</strong> sont immuables, les <strong>dictionnaires</strong> stockent des paires clé/valeur, et les <strong>sets</strong> des éléments uniques. Choisir la bonne structure optimise l'algorithme."}
   ],
   quiz:[
     {question:"Quelle est la différence principale entre une liste et un tuple en Python ?",options:["Le tuple est ordonné, la liste non","La liste est modifiable, le tuple est immuable","Le tuple peut contenir des chiffres, pas la liste","Il n'y a aucune différence"],correct:1,explanation:"Une liste est modifiable (mutable) après création, tandis qu'un tuple est immuable : on ne peut pas modifier ses éléments après sa création."},
     {question:"Que signifie le principe DRY en programmation ?",options:["Don't Repeat Yourself","Data Runs Yearly","Debug Regularly Yourself","Do Repeat Your code"],correct:0,explanation:"DRY (Don't Repeat Yourself) est un principe fondamental encourageant à écrire du code réutilisable via des fonctions plutôt que de la duplication."},
     {question:"Que se passe-t-il si la condition d'un 'while' reste toujours vraie ?",options:["Le programme s'arrête","Une erreur se produit","Une boucle infinie se crée","Le code s'exécute deux fois"],correct:2,explanation:"Si la condition d'un while reste toujours vraie, on crée une boucle infinie qui bloque l'exécution du programme."},
     {question:"Quel est le résultat de 15 // 4 en Python ?",options:["3.75","3","4","3.0"],correct:1,explanation:"L'opérateur // effectue une division entière, qui tronque le résultat au nombre entier inférieur. 15 divisé par 4 donne 3."}
   ]},
  {id:3,title:"Systèmes d'Exploitation et Terminal",category:"systemes",level:"Intermédiaire",duration:"5h00",rating:4.7,students:2180,icon:"fa-terminal",color:"#ffc107",
   description:"Comprenez le rôle central de Windows, macOS et Linux. Apprenez à naviguer dans le système de fichiers et à maîtriser la puissance de la ligne de commande.",
   image:"https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"Le Rôle du Système d'Exploitation",duration:"18 min",type:"video",videoId:"5zen5KS7BLI",content:"Un <strong>Système d'Exploitation</strong> (OS) est le logiciel fondamental qui fait le pont entre le matériel et l'utilisateur. Il gère le <strong>processeur</strong> (ordonnancement des tâches), la <strong>mémoire</strong> (allocation et isolation des processus), le <strong>système de fichiers</strong> (organisation des données) et les <strong>périphériques</strong> via des pilotes (drivers). Sans OS, chaque programme devrait gérer le matériel directement, ce qui serait chaotique."},
     {id:2,title:"Unix, Linux et l'Open Source",duration:"22 min",type:"text",content:"<strong>Linux</strong> est une famille de systèmes d'exploitation basés sur le noyau Linux, créé par Linus Torvalds en 1991. Héritier d'<strong>Unix</strong>, il respecte la philosophie modulaire : chaque programme fait une seule chose, mais le fait bien. Sa licence <strong>GPL</strong> garantit qu'il est libre et open-source. Les <strong>distributions</strong> (Ubuntu, Fedora, Debian) adaptent le noyau à différents usages, des serveurs aux objets connectés."},
     {id:3,title:"Navigation et Permissions dans le Terminal",duration:"35 min",type:"video",videoId:"vX92aS1xsaE",content:"La <strong>ligne de commande</strong> (CLI) permet un contrôle total du système. Commandes essentielles : <strong>pwd</strong> (répertoire actuel), <strong>ls</strong> (lister), <strong>cd</strong> (naviguer), <strong>mkdir</strong> (créer dossier), <strong>rm</strong> (supprimer). Le système de permissions Linux sécurise les fichiers : <strong>r</strong> (lecture, 4), <strong>w</strong> (écriture, 2), <strong>x</strong> (exécution, 1). La commande chmod 755 mon_script.sh donne tous les droits au propriétaire, et lecture/exécution aux autres."},
     {id:4,title:"Gestion des Processus et Ressources",duration:"25 min",type:"text",content:"Un <strong>processus</strong> est un programme en cours d'exécution. La commande <strong>ps</strong> ou <strong>top</strong> liste les processus actifs, <strong>kill</strong> envoie un signal de fin. L'OS alloue le <strong>temps CPU</strong> via un algorithme d'ordonnancement (Round-Robin, Priorité). La mémoire est gérée par <strong>pagination</strong> : la RAM est découpée en pages pour isoler les programmes et utiliser du stockage comme extension (Swap)."}
   ],
   quiz:[
     {question:"Quel est le rôle principal de l'ordonnanceur (scheduler) dans un OS ?",options:["Trier les fichiers","Répartir le temps CPU entre les processus","Gérer la carte graphique","Crypter les mots de passe"],correct:1,explanation:"L'ordonnanceur attribue du temps d'exécution sur le processeur aux différents processus de manière équitable et efficace."},
     {question:"Que fait la commande 'chmod 755 script.sh' ?",options:["Supprime le fichier","Donne tous les droits au propriétaire et lecture/exécution aux autres","Rend le fichier invisible","Compresse le fichier"],correct:1,explanation:"7 (4+2+1) = lecture/écriture/exécution pour le propriétaire. 5 (4+1) = lecture/exécution pour le groupe et les autres."},
     {question:"Qu'est-ce que le Swap sous Linux ?",options:["Une commande réseau","Un échange de variables","L'utilisation du disque dur comme extension de la RAM","Un raccourci clavier"],correct:2,explanation:"Le Swap est un espace sur le disque dur utilisé quand la RAM physique est pleine, permettant d'étendre la mémoire virtuelle."},
     {question:"Pourquoi Linux est-il qualifié d'Open Source ?",options:["Parce qu'il est gratuit","Parce que son code source est accessible et modifiable","Parce qu'il n'a pas de virus","Parce qu'il est facile à utiliser"],correct:1,explanation:"Open Source signifie que le code source est publiquement disponible, permettant à quiconque de l'étudier, le modifier et le redistribuer."}
   ]},
  {id:4,title:"Fondamentaux des Réseaux TCP/IP",category:"reseaux",level:"Intermédiaire",duration:"5h30",rating:4.8,students:4100,icon:"fa-network-wired",color:"#a855f7",
   description:"Découvrez comment les ordinateurs communiquent à travers Internet. Des câbles Ethernet au protocole IP, en passant par le routage et le DNS.",
   image:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"Le Modèle OSI et TCP/IP",duration:"25 min",type:"video",videoId:"26jazyc7VNk",content:"La communication réseau est structurée en <strong>couches</strong>. Le modèle <strong>OSI</strong> (7 couches) est la référence théorique (Physique, Liaison, Réseau, Transport, Session, Présentation, Application). Le modèle <strong>TCP/IP</strong> (4 couches) est le standard pratique d'Internet. Chaque couche a un rôle spécifique : la couche <strong>Réseau (IP)</strong> gère l'adressage et le routage, la couche <strong>Transport (TCP/UDP)</strong> assure la livraison des données."},
     {id:2,title:"Adressage IP, Masques et Sous-réseaux",duration:"30 min",type:"text",content:"Chaque appareil sur un réseau IP possède une <strong>adresse IP</strong> unique. L'<strong>IPv4</strong> (ex: 192.168.1.15) est un nombre sur 32 bits. Le <strong>masque de sous-réseau</strong> (ex: 255.255.255.0) sépare l'adresse en partie réseau et partie hôte. La <strong>passerelle</strong> (gateway) relie le réseau local à Internet. L'<strong>IPv6</strong> (128 bits) résout la pénurie d'adresses IPv4. Les adresses <strong>publiques</strong> sont routables sur Internet, les <strong>privées</strong> (192.168.x.x, 10.x.x.x) sont réservées aux réseaux locaux."},
     {id:3,title:"Le Protocole DNS et DHCP",duration:"22 min",type:"video",videoId:"qzWdzAvfBoo",content:"Le <strong>DNS</strong> (Domain Name System) est l'annuaire d'Internet : il traduit les noms de domaine lisibles par l'humain (google.com) en adresses IP compréhensibles par les machines (142.250.190.46). Le <strong>DHCP</strong> (Dynamic Host Configuration Protocol) attribue automatiquement une adresse IP, un masque et une passerelle aux appareils qui rejoignent le réseau, évitant la configuration manuelle de chaque machine."},
     {id:4,title:"Routage, Switchs et Pare-feu",duration:"28 min",type:"text",content:"Un <strong>switch</strong> connecte les appareils d'un même réseau local en utilisant leurs adresses <strong>MAC</strong>. Un <strong>routeur</strong> connecte des réseaux différents et choisit le meilleur chemin pour les paquets IP (routage). Le <strong>pare-feu</strong> (firewall) filtre le trafic entrant et sortant selon des règles de sécurité (ex: bloquer le port 23 pour Telnet). Ensemble, ils forment l'infrastructure de tout réseau d'entreprise."}

     {question:"Quel protocole traduit les noms de domaine en adresses IP ?",options:["DHCP","FTP","DNS","SMTP"],correct:2,explanation:"Le DNS (Domain Name System) est le service qui résout les noms de domaine (comme example.com) en adresses IP."},
     {question:"Quelle est la différence principale entre un switch et un routeur ?",options:["Le switch est plus rapide","Le routeur connecte des réseaux différents, le switch connecte des appareils du même réseau","Le switch utilise l'IP, le routeur utilise la MAC","Il n'y a pas de différence"],correct:1,explanation:"Le switch relie des appareils au sein d'un même réseau local (LAN) via les adresses MAC, tandis que le routeur relie des réseaux différents via les adresses IP."},
     {question:"Que fait le protocole DHCP ?",options:["Il chiffre les données","Il traduit les adresses IP","Il attribue automatiquement des adresses IP","Il filtre les virus"],correct:2,explanation:"Le DHCP attribue dynamiquement des configurations IP aux appareils d'un réseau pour éviter la configuration manuelle."}

  {id:5,title:"Cybersécurité : Menaces et Défense",category:"securite",level:"Intermédiaire",duration:"4h00",rating:4.9,students:4890,icon:"fa-shield-halved",color:"#ef4444",
   description:"Identifiez les menaces numériques actuelles, du phishing au ransomware, et apprenez les bonnes pratiques pour sécuriser vos comptes et vos données.",
   image:"https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"Paysage des Menaces Actuelles",duration:"25 min",type:"video",videoId:"Wq2jXa9ItxM",content:"Les <strong>malwares</strong> (logiciels malveillants) incluent les <strong>virus</strong> (se propagent en s'attachant à des fichiers), les <strong>vers</strong> (se répliquent via le réseau), les <strong>troyens</strong> (se dissimulent en logiciel légitime) et les <strong>ransomwares</strong> (chiffrent les données et demandent une rançon). Le <strong>phishing</strong> (hameçonnage) utilise de faux emails ou sites pour voler des identifiants. L'<strong>ingénierie sociale</strong> manipule psychologiquement la victime plutôt que d'exploiter une faille technique."},
     {id:2,title:"Cryptographie et Chiffrement",duration:"30 min",type:"text",content:"La <strong>cryptographie</strong> protège la confidentialité et l'intégrité des données. Le <strong>chiffrement symétrique</strong> (AES) utilise la même clé pour chiffrer et déchiffrer (rapide, mais échange de clé risqué). Le <strong>chiffrement asymétrique</strong> (RSA) utilise une clé publique (pour chiffrer) et une clé privée (pour déchiffrer). Le <strong>HTTPS</strong> combine les deux : une poignée de main asymétrique pour échanger une clé symétrique de session, qui chiffre ensuite les données."},
     {id:3,title:"Authentification Forte et Mots de Passe",duration:"22 min",type:"video",videoId:"4GQxevlvFG8",content:"Un <strong>mot de passe robuste</strong> mesure au moins 14 caractères, combinant majuscules, minuscules, chiffres et symboles, sans dictionnaire. L'<strong>authentification multi-facteurs (MFA/2FA)</strong> combine ce que vous savez (mot de passe), ce que vous avez (téléphone, clé USB de sécurité) et ce que vous êtes (empreinte digitale). Utilisez un <strong>gestionnaire de mots de passe</strong> (Bitwarden, 1Password) pour générer et stocker des mots de passe uniques pour chaque service."},
     {id:4,title:"RGPD et Protection des Données Personnelles",duration:"20 min",type:"text",content:"Le <strong>RGPD</strong> (Règlement Général sur la Protection des Données) encadre le traitement des données personnelles en Europe. Principes clés : <strong>minimisation</strong> (ne collecter que le nécessaire), <strong>consentement</strong> explicite, <strong>droit d'accès</strong>, <strong>droit à l'oubli</strong> (suppression) et <strong>portabilité</strong>. Toute violation de données doit être notifiée à la CNIL sous 72h. La non-conformité peut entraîner des amendes allant jusqu'à 4% du CA mondial."}
   ],

     {question:"Quelle est la différence entre le chiffrement symétrique et asymétrique ?",options:["Le symétrique est plus lent","L'asymétrique utilise une paire de clés (publique/privée)","Le symétrique n'est pas sécurisé","Il n'y a pas de différence"],correct:1,explanation:"Le chiffrement asymétrique utilise deux clés mathématiquement liées : une publique pour chiffrer et une privée pour déchiffrer, résolvant le problème de l'échange de clé."},
     {question:"Que signifie l'authentification 2FA ?",options:["Deux mots de passe différents","Authentification à deux facteurs (ex: mdp + code SMS)","Double filtrage antivirus","Deux comptes utilisateur"],correct:1,explanation:"La 2FA combine deux preuves d'identité distinctes : un facteur de connaissance (mdp) et un facteur de possession (téléphone/clé de sécurité)."},
     {question:"Quel est le délai de notification d'une violation de données selon le RGPD ?",options:["24 heures","72 heures","7 jours","1 mois"],correct:1,explanation:"Le RGPD impose de notifier toute violation de données à l'autorité de contrôle (CNIL) dans un délai de 72 heures maximum après en avoir pris connaissance."}
   ]},
  {id:6,title:"Bases de Données Relationnelles et SQL",category:"donnees",level:"Avancé",duration:"6h30",rating:4.6,students:1850,icon:"fa-database",color:"#06b6d4",
   description:"Maîtrisez la modélisation de bases de données relationnelles, l'algèbre relationnelle et le langage SQL pour interroger et structurer l'information.",
   image:"https://images.unsplash.com/photo-1544383835-bda2bc66a55d?auto=format&fit=crop&w=600&q=80",
   lessons:[
     {id:1,title:"Modélisation et Algèbre Relationnelle",duration:"28 min",type:"video",videoId:"1PMSHTKVCo8",content:"Une <strong>base de données relationnelle</strong> organise l'information en <strong>tables</strong> (relations). Une table contient des <strong>lignes</strong> (tuples/enregistrements) et des <strong>colonnes</strong> (attributs). La <strong>clé primaire</strong> identifie chaque ligne de façon unique. La <strong>clé étrangère</strong> crée un lien logique entre deux tables. L'<strong>algèbre relationnelle</strong> (Sélection, Projection, Jointure) est le fondement mathématique permettant de manipuler ces données sans ambiguïté."},
     {id:2,title:"Conception : Merise et Normalisation",duration:"35 min",type:"text",content:"La méthode <strong>Merise</strong> permet de concevoir une base de données via un <strong>MCD</strong> (Modèle Conceptuel de Données) qui identifie les entités et associations. La <strong>normalisation</strong> élimine la redondance. La <strong>1NF</strong> impose des valeurs atomiques (non divisibles). La <strong>2NF</strong> supprime les dépendances partielles. La <strong>3NF</strong> supprime les dépendances transitives. Une base normalisée est plus cohérente, plus facile à maintenir et évite les anomalies de mise à jour."},
     {id:3,title:"Le Langage SQL (DML et DDL)",duration:"40 min",type:"video",videoId:"YgyB6ZRbX9w",content:"<strong>SQL</strong> (Structured Query Language) est le standard pour manipuler les données. Le <strong>DML</strong> (Data Manipulation Language) gère le contenu : <strong>SELECT</strong> (lire), <strong>INSERT</strong> (ajouter), <strong>UPDATE</strong> (modifier), <strong>DELETE</strong> (supprimer). Le <strong>DDL</strong> (Data Definition Language) gère la structure : <strong>CREATE TABLE</strong>, <strong>ALTER TABLE</strong>, <strong>DROP TABLE</strong>. La clause <strong>WHERE</strong> filtre les résultats, <strong>ORDER BY</strong> trie, <strong>GROUP BY</strong> agrège avec des fonctions (COUNT, SUM, AVG)."},
     {id:4,title:"Jointures et Sous-requêtes",duration:"30 min",type:"text",content:"Les <strong>jointures</strong> combinent les données de plusieurs tables. <strong>INNER JOIN</strong> retourne les lignes correspondantes dans les deux tables. <strong>LEFT JOIN</strong> retourne tout de la table gauche et les correspondances de la droite. <strong>RIGHT JOIN</strong> fait l'inverse. <strong>FULL OUTER JOIN</strong> retourne tout des deux tables. Les <strong>sous-requêtes</strong> (ou requêtes imbriquées) permettent d'utiliser le résultat d'un SELECT dans un autre SELECT, souvent dans la clause WHERE ou FROM."}
   ],
   quiz:[
     {question:"Quel est l'objectif principal de la normalisation (3NF) ?",options:["Accélérer les requêtes","Éliminer la redondance et les anomalies de mise à jour","Créer plus de tables","Sécuriser la base"],correct:1,explanation:"La normalisation vise à organiser les données pour éliminer la redondance et éviter les anomalies lors de l'insertion, modification ou suppression."},
     {question:"Quelle est la différence entre INNER JOIN et LEFT JOIN ?",options:["INNER JOIN est plus rapide","LEFT JOIN retourne toutes les lignes de la table de gauche même sans correspondance","INNER JOIN retourne plus de résultats","Il n'y a pas de différence"],correct:1,explanation:"LEFT JOIN conserve toutes les lignes de la table de gauche, en complétant avec NULL s'il n'y a pas de correspondance dans la table de droite."},
     {question:"Quelle commande SQL permet de modifier la structure d'une table ?",options:["UPDATE","ALTER TABLE","INSERT INTO","MODIFY TABLE"],correct:1,explanation:"ALTER TABLE est une commande DDL permettant d'ajouter, supprimer ou modifier des colonnes dans une table existante."},
     {question:"Que fait la requête : SELECT COUNT(*) FROM utilisateurs WHERE actif = 1;",options:["Elle supprime les utilisateurs inactifs","Elle compte le nombre total d'utilisateurs actifs","Elle affiche les utilisateurs actifs","Elle met à jour le statut des utilisateurs"],correct:1,explanation:"COUNT(*) compte le nombre de lignes, et WHERE actif = 1 filtre pour ne compter que les utilisateurs dont le statut est actif."}

let state={currentUser:null,currentView:'login',currentCourse:null,currentLesson:null,quizState:null,progress:{},mobileSidebar:false,searchQuery:'',categoryFilter:'all'};
function saveState(){localStorage.setItem('neolearn_state',JSON.stringify({currentUser:state.currentUser,progress:state.progress}))}
function loadState(){try{const s=JSON.parse(localStorage.getItem('neolearn_state'));if(s&&s.currentUser){state.currentUser=s.currentUser;state.progress=s.progress||{};state.currentView='dashboard'}}catch(e){}}
function showToast(msg,type='success'){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className=`toast toast-${type}`;const icons={success:'fa-check-circle',error:'fa-times-circle',info:'fa-info-circle'};t.innerHTML=`<i class="fas ${icons[type]||icons.info}"></i><span>${msg}</span>`;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300)},3000)}
function getProgress(uid){if(!state.progress[uid])state.progress[uid]={enrolledCourses:[],completedLessons:{},quizScores:{},xp:0,achievements:[]};return state.progress[uid]}
function getCourseProgress(uid,cid){const p=getProgress(uid);if(!p.enrolledCourses.includes(cid))return 0;const c=COURSES.find(x=>x.id===cid);return c?Math.round(((p.completedLessons[cid]||[]).length/c.lessons.length)*100):0}
function getTotalLessonsCompleted(uid){return Object.values(getProgress(uid).completedLessons).reduce((s,a)=>s+a.length,0)}
function checkAchievements(uid){const p=getProgress(uid);const e=[...p.achievements];if(p.enrolledCourses.length>=1&&!e.includes('first_course'))e.push('first_course');if(getTotalLessonsCompleted(uid)>=1&&!e.includes('first_lesson'))e.push('first_lesson');if(getTotalLessonsCompleted(uid)>=5&&!e.includes('five_lessons'))e.push('five_lessons');if(p.enrolledCourses.length>=3&&!e.includes('three_courses'))e.push('three_courses');if(Object.values(p.quizScores).some(q=>q.best===100)&&!e.includes('quiz_perfect'))e.push('quiz_perfect');const n=e.filter(a=>!p.achievements.includes(a));p.achievements=e;n.forEach(a=>{const ach=ACHIEVEMENTS.find(x=>x.id===a);if(ach)showToast(`Succès : ${ach.title} !`,'info')});saveState()}
function enrollCourse(cid){const p=getProgress(state.currentUser.username);if(!p.enrolledCourses.includes(cid)){p.enrolledCourses.push(cid);p.xp+=50;showToast('Inscrit au cours ! +50 XP');checkAchievements(state.currentUser.username)}saveState()}
function completeLesson(cid,lid){const p=getProgress(state.currentUser.username);if(!p.completedLessons[cid])p.completedLessons[cid]=[];if(!p.completedLessons[cid].includes(lid)){p.completedLessons[cid].push(lid);p.xp+=25;showToast('Leçon terminée ! +25 XP');checkAchievements(state.currentUser.username)}saveState()}
function saveQuizScore(cid,score){const p=getProgress(state.currentUser.username);if(!p.quizScores[cid])p.quizScores[cid]={best:0,attempts:0};p.quizScores[cid].attempts++;if(score>p.quizScores[cid].best)p.quizScores[cid].best=score;p.xp+=Math.round(score*0.5);checkAchievements(state.currentUser.username);saveState()}

function handleGoogleNext(){
  const emailInput=document.getElementById('google-email-input');const errorDiv=document.getElementById('google-email-error');const email=emailInput.value.trim();
  const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!email||!emailRegex.test(email)){errorDiv.textContent='Veuillez entrer une adresse e-mail valide.';errorDiv.style.display='block';emailInput.style.borderColor='#d93025';return}
  errorDiv.style.display='none';emailInput.style.borderColor='#1a73e8';
  const username=email.split('@')[0].replace(/[^a-zA-Z0-9_]/g,'_');const initial=username[0].toUpperCase();
  document.getElementById('google-avatar-big').textContent=initial;document.getElementById('google-welcome-email').textContent=email;
  document.getElementById('google-step-1').style.display='none';document.getElementById('google-step-2').style.display='block';
  setTimeout(()=>{const users=JSON.parse(localStorage.getItem('neolearn_users')||'{}');if(!users[username])users[username]={password:'google_oauth',authProvider:'google',email:email};localStorage.setItem('neolearn_users',JSON.stringify(users));state.currentUser={username,authProvider:'google',email,initial};state.currentView='dashboard';saveState();closeGoogleModal();showToast(`Compte NeoLearn créé via Google : ${username}`);render()},1800);
}
