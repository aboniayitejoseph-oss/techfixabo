      <p class="text-lg mb-8" style="color:var(--muted);max-width:400px">Votre passerelle vers la maîtrise de l'informatique. Des cours fondés sur des concepts réels et vérifiables.</p>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center p-6 lg:p-12 relative z-10">
    <div class="w-full max-w-md animate-in-delay">
      <div class="lg:hidden text-center mb-8"><h1 class="text-3xl font-bold" style="font-family:'Space Grotesk'">Neo<span style="color:var(--primary)">Learn</span></h1></div>
      <div id="auth-tabs" class="flex gap-2 mb-6"><button class="tab-btn active" data-auth-tab="login">Connexion</button><button class="tab-btn" data-auth-tab="register">Créer un compte</button></div>
      <form id="login-form" class="space-y-5">
        <button type="button" class="btn-google" id="google-signin-btn">${GOOGLE_SVG}<span>Se connecter avec Google</span></button>
        <div style="display:flex;align-items:center;gap:12px;margin:4px 0"><div style="flex:1;height:1px;background:var(--border)"></div><span style="color:var(--muted);font-size:.8rem;white-space:nowrap">ou avec votre compte NeoLearn</span><div style="flex:1;height:1px;background:var(--border)"></div></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Nom d'utilisateur</label><input type="text" id="login-user" class="input-field" placeholder="votre_identifiant" required></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Mot de passe</label><input type="password" id="login-pass" class="input-field" placeholder="Votre mot de passe" required></div>
        <button type="submit" class="btn-primary w-full text-center">Se connecter</button>
        <p class="text-center text-sm" style="color:var(--muted)">Pas de compte ? <a href="#" data-auth-switch="register" style="color:var(--primary);font-weight:600">Créer un compte</a></p>
      </form>
      <form id="register-form" class="space-y-5" style="display:none">
        <button type="button" class="btn-google" id="google-signup-btn">${GOOGLE_SVG}<span>Créer via Google</span></button>
        <div style="display:flex;align-items:center;gap:12px;margin:4px 0"><div style="flex:1;height:1px;background:var(--border)"></div><span style="color:var(--muted);font-size:.8rem;white-space:nowrap">ou par formulaire</span><div style="flex:1;height:1px;background:var(--border)"></div></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Adresse e-mail <span style="color:var(--accent)">*</span></label><input type="email" id="reg-email" class="input-field" placeholder="votre.email@exemple.com" required></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Nom d'utilisateur</label><input type="text" id="reg-user" class="input-field" placeholder="choisissez_un_identifiant" required></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Mot de passe</label><input type="password" id="reg-pass" class="input-field" placeholder="Minimum 6 caractères" required></div>
        <div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Confirmer le mot de passe</label><input type="password" id="reg-pass-confirm" class="input-field" placeholder="Retapez le mot de passe" required></div>
        <button type="submit" class="btn-primary w-full text-center">Créer mon compte NeoLearn</button>
        <p class="text-center text-sm" style="color:var(--muted)">Déjà inscrit ? <a href="#" data-auth-switch="login" style="color:var(--primary);font-weight:600">Se connecter</a></p>
      </form>
    </div>
  </div></div>`;
}

function renderMainPlatform(){const viewContent={dashboard:renderDashboard,courses:renderCourses,courseDetail:renderCourseDetail,quiz:renderQuizView,progress:renderProgressView,settings:renderSettingsView}[state.currentView]||renderDashboard;return `<div class="flex min-h-screen">${renderSidebar()}<div class="main-content flex-1" style="margin-left:260px">${renderTopBar()}<main class="p-6 lg:p-8">${viewContent()}</main></div></div>`}

function renderSidebar(){const links=[{view:'dashboard',icon:'fa-th-large',label:'Tableau de bord'},{view:'courses',icon:'book',label:'Cours'},{view:'progress',icon:'fa-chart-line',label:'Progrès'},{view:'settings',icon:'fa-cog',label:'Paramètres'}];const p=getProgress(state.currentUser.username);const isGoogle=state.currentUser.authProvider==='google';return `<aside class="sidebar ${state.mobileSidebar?'mobile-open':''}" id="sidebar"><div class="p-6 flex items-center gap-3 border-b" style="border-color:var(--border)"><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#00b896);display:flex;align-items:center;justify-content:center"><i class="fas fa-microchip" style="color:#060a13;font-size:1rem"></i></div><h2 class="font-bold text-lg" style="font-family:'Space Grotesk'">Neo<span style="color:var(--primary)">Learn</span></h2></div><nav class="py-4">${links.map(l=>`<div class="sidebar-link ${state.currentView===l.view||(l.view==='courses'&&(state.currentView==='courseDetail'||state.currentView==='quiz'))?'active':''}" data-nav="${l.view}"><i class="fas ${l.icon}" style="width:20px;text-align:center"></i><span>${l.label}</span></div>`).join('')}</nav><div class="absolute bottom-0 left-0 right-0 p-4 border-t" style="border-color:var(--border)"><div class="glass p-4" style="border-radius:12px"><div class="flex items-center gap-3 mb-3"><div style="width:36px;height:36px;border-radius:50%;${isGoogle?'background:linear-gradient(135deg,#4285f4,#34a853)':'background:linear-gradient(135deg,var(--accent),#ff8c42)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff">${state.currentUser.initial||state.currentUser.username[0].toUpperCase()}</div><div><div class="font-semibold text-sm">${state.currentUser.username}</div><div class="flex items-center gap-1 text-xs" style="color:var(--primary)">${isGoogle?'<i class="fab fa-google" style="font-size:.6rem"></i> ':''}<span style="color:var(--muted)">${p.xp} XP</span></div></div></div><div class="sidebar-link p-2" data-action="logout" style="border-left:none;color:var(--muted);font-size:.85rem"><i class="fas fa-sign-out-alt" style="width:18px;text-align:center"></i><span>Déconnexion</span></div></div></div></aside>`}

function renderTopBar(){const titles={dashboard:'Tableau de bord',courses:'Catalogue de cours',courseDetail:'Cours',quiz:'Quiz',progress:'Mes progrès',settings:'Paramètres'};const isGoogle=state.currentUser.authProvider==='google';return `<header class="flex items-center justify-between p-6 lg:px-8 border-b" style="border-color:var(--border);background:rgba(6,10,19,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40"><div class="flex items-center gap-4"><button class="lg:hidden" data-action="toggle-sidebar"><i class="fas fa-bars text-lg"></i></button><h3 class="text-lg font-semibold" style="font-family:'Space Grotesk'">${titles[state.currentView]||'NeoLearn'}</h3></div><div class="flex items-center gap-4"><div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl" style="background:var(--bg2);border:1px solid var(--border)"><i class="fas fa-search text-sm" style="color:var(--muted)"></i><input type="text" placeholder="Rechercher..." class="bg-transparent border-none outline-none text-sm" style="width:160px;color:var(--text)" data-action="search-input"></div><div style="width:36px;height:36px;border-radius:50%;${isGoogle?'background:linear-gradient(135deg,#4285f4,#34a853)':'background:linear-gradient(135deg,var(--accent),#ff8c42)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;cursor:pointer;color:#fff">${state.currentUser.initial||state.currentUser.username[0].toUpperCase()}</div></div></header>`}

function renderDashboard(){const p=getProgress(state.currentUser.username);const tl=getTotalLessonsCompleted(state.currentUser.username);const ce=p.enrolledCourses.length;const avg=Object.values(p.quizScores).length?Math.round(Object.values(p.quizScores).reduce((s,q)=>s+q.best,0)/Object.values(p.quizScores).length):0;const rec=COURSES.filter(c=>!p.enrolledCourses.includes(c.id)).slice(0,3);const inp=p.enrolledCourses.map(id=>COURSES.find(c=>c.id===id)).filter(Boolean).filter(c=>getCourseProgress(state.currentUser.username,c.id)<100).slice(0,3);return `<div class="space-y-8"><div class="glass p-6 lg:p-8 animate-in" style="background:linear-gradient(135deg,rgba(0,221,179,.08),rgba(255,87,51,.04));border-color:rgba(0,221,179,.2)"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><div><h1 class="text-2xl lg:text-3xl font-bold mb-2" style="font-family:'Space Grotesk'">Bienvenue, ${state.currentUser.username}</h1><p style="color:var(--muted)">Continuez votre apprentissage informatique.</p></div><button class="btn-primary" data-nav="courses">Explorer les cours</button></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 animate-in-delay"><div class="glass stat-card p-5"><div style="width:40px;height:40px;border-radius:10px;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="fas fa-book-open" style="color:var(--primary)"></i></div><div class="text-2xl font-bold" style="font-family:'Space Grotesk'">${ce}</div><div class="text-sm" style="color:var(--muted)">Cours inscrits</div></div><div class="glass stat-card p-5"><div style="width:40px;height:40px;border-radius:10px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="fas fa-check-circle" style="color:var(--accent)"></i></div><div class="text-2xl font-bold" style="font-family:'Space Grotesk'">${tl}</div><div class="text-sm" style="color:var(--muted)">Leçons terminées</div></div><div class="glass stat-card p-5"><div style="width:40px;height:40px;border-radius:10px;background:rgba(255,193,7,.12);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="fas fa-trophy" style="color:var(--gold)"></i></div><div class="text-2xl font-bold" style="font-family:'Space Grotesk'">${avg}%</div><div class="text-sm" style="color:var(--muted)">Score moyen</div></div><div class="glass stat-card p-5"><div style="width:40px;height:40px;border-radius:10px;background:rgba(168,85,247,.12);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="fas fa-bolt" style="color:#a855f7"></i></div><div class="text-2xl font-bold" style="font-family:'Space Grotesk'">${p.xp}</div><div class="text-sm" style="color:var(--muted)">Points XP</div></div></div><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 glass p-6 animate-in-delay2"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Progression par cours</h3><canvas id="dashboard-chart" height="200"></canvas></div><div class="glass p-6 animate-in-delay2"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Succès</h3><div class="space-y-3">${p.achievements.length===0?'<p style="color:var(--muted);font-size:.9rem">Commencez un cours !</p>':p.achievements.slice(0,5).map(aId=>{const a=ACHIEVEMENTS.find(x=>x.id===aId);return a?`<div class="flex items-center gap-3 p-3 rounded-xl" style="background:rgba(255,255,255,.03)"><div style="width:36px;height:36px;border-radius:10px;background:${a.color}20;display:flex;align-items:center;justify-content:center"><i class="fas ${a.icon}" style="color:${a.color};font-size:.85rem"></i></div><div><div class="font-semibold text-sm">${a.title}</div><div class="text-xs" style="color:var(--muted)">${a.desc}</div></div></div>`:''}).join('')}</div></div></div>${inp.length>0?`<div class="animate-in-delay2"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Continuer</h3><div class="grid md:grid-cols-3 gap-4">${inp.map(c=>{const prog=getCourseProgress(state.currentUser.username,c.id);return`<div class="glass p-5 cursor-pointer" data-action="open-course" data-course-id="${c.id}"><div class="flex items-center gap-3 mb-3"><div style="width:44px;height:44px;border-radius:12px;background:${c.color}20;display:flex;align-items:center;justify-content:center"><i class="fas ${c.icon}" style="color:${c.color}"></i></div><div><div class="font-semibold text-sm">${c.title}</div><div class="text-xs" style="color:var(--muted)">${prog}% complété</div></div></div><div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div></div>`}).join('')}</div></div>`:''}${rec.length>0?`<div><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Recommandés</h3><div class="grid md:grid-cols-3 gap-4">${rec.map(c=>`<div class="glass overflow-hidden cursor-pointer" data-action="open-course" data-course-id="${c.id}" style="animation:fadeInUp .5s ease both"><img src="${c.image}" alt="${c.title}" class="w-full h-36 object-cover" loading="lazy"><div class="p-5"><div class="flex items-center gap-2 mb-2"><span class="badge badge-${c.level.toLowerCase()==='débutant'?'debutant':c.level.toLowerCase()==='intermédiaire'?'intermediaire':'avance'}">${c.level}</span></div><h4 class="font-bold text-sm mb-2">${c.title}</h4></div></div>`).join('')}</div></div>`:''}</div>`}

function initDashboardCharts(){const canvas=document.getElementById('dashboard-chart');if(!canvas)return;const p=getProgress(state.currentUser.username);const labels=p.enrolledCourses.map(id=>{const c=COURSES.find(x=>x.id===id);return c?c.title.split(' ').slice(0,3).join(' '):''});const data=p.enrolledCourses.map(id=>getCourseProgress(state.currentUser.username,id));if(labels.length===0)return;new Chart(canvas,{type:'bar',data:{labels,datasets:[{label:'Progression (%)',data,backgroundColor:'rgba(0,221,179,0.3)',borderColor:'rgba(0,221,179,0.8)',borderWidth:2,borderRadius:8,barThickness:32}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{color:'#7a8bb5',callback:v=>v+'%'},grid:{color:'rgba(30,45,74,0.4)'}},x:{ticks:{color:'#7a8bb5',font:{size:11}},grid:{display:false}}}}})}

function renderCourses(){const p=getProgress(state.currentUser.username);let f=COURSES;if(state.categoryFilter&&state.categoryFilter!=='all')f=f.filter(c=>c.category===state.categoryFilter);if(state.searchQuery)f=f.filter(c=>c.title.toLowerCase().includes(state.searchQuery.toLowerCase()));return `<div class="space-y-6 animate-in"><div class="flex flex-wrap gap-2 mb-2">${CATEGORIES.map(cat=>`<button class="tab-btn ${state.categoryFilter===cat.id?'active':''}" data-filter-cat="${cat.id}"><i class="fas ${cat.icon} mr-1"></i>${cat.label}</button>`).join('')}</div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">${f.map((c,i)=>{const enrolled=p.enrolledCourses.includes(c.id);const prog=getCourseProgress(state.currentUser.username,c.id);return`<div class="glass overflow-hidden cursor-pointer" data-action="open-course" data-course-id="${c.id}" style="animation:fadeInUp .5s ease ${i*.08}s both"><div class="relative"><img src="${c.image}" alt="${c.title}" class="w-full h-44 object-cover" loading="lazy"><div class="absolute top-3 right-3"><span class="badge badge-${c.level.toLowerCase()==='débutant'?'debutant':c.level.toLowerCase()==='intermédiaire'?'intermediaire':'avance'}">${c.level}</span></div>${enrolled?`<div class="absolute bottom-3 left-3 right-3"><div class="progress-bar" style="height:4px"><div class="progress-fill" style="width:${prog}%"></div></div></div>`:''}</div><div class="p-5"><div class="flex items-center gap-2 mb-2"><div style="width:32px;height:32px;border-radius:8px;background:${c.color}20;display:flex;align-items:center;justify-content:center"><i class="fas ${c.icon}" style="color:${c.color};font-size:.8rem"></i></div><span class="text-xs font-semibold" style="color:${c.color}">${CATEGORIES.find(cat=>cat.id===c.category)?.label||''}</span></div><h4 class="font-bold mb-2">${c.title}</h4><p class="text-sm mb-4" style="color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${c.description}</p><div class="flex items-center justify-between text-xs" style="color:var(--muted)"><span><i class="fas fa-clock mr-1"></i>${c.duration}</span><span><i class="fas fa-layer-group mr-1"></i>${c.lessons.length} leçons</span></div></div></div>`}).join('')}</div>${f.length===0?'<div class="text-center py-12"><p style="color:var(--muted)">Aucun cours.</p></div>':''}</div>`}

function renderCourseDetail(){const course=COURSES.find(c=>c.id===state.currentCourse);if(!course)return'<p>Cours introuvable.</p>';const p=getProgress(state.currentUser.username);const enrolled=p.enrolledCourses.includes(course.id);const completedLessons=p.completedLessons[course.id]||[];const currentLessonObj=course.lessons.find(l=>l.id===state.currentLesson)||course.lessons[0];const prog=getCourseProgress(state.currentUser.username,course.id);const quizScore=p.quizScores[course.id];return `<div class="space-y-6 animate-in"><div class="glass p-6 lg:p-8" style="background:linear-gradient(135deg,${course.color}10,transparent);border-color:${course.color}30"><div class="flex flex-col lg:flex-row gap-6"><div class="flex-1"><div class="flex items-center gap-3 mb-3"><button class="text-sm" style="color:var(--muted)" data-nav="courses"><i class="fas fa-arrow-left mr-2"></i>Retour</button></div><div class="flex items-center gap-3 mb-3"><span class="badge badge-${course.level.toLowerCase()==='débutant'?'debutant':course.level.toLowerCase()==='intermédiaire'?'intermediaire':'avance'}">${course.level}</span><span class="text-sm" style="color:var(--muted)"><i class="fas fa-clock mr-1"></i>${course.duration}</span></div><h1 class="text-2xl lg:text-3xl font-bold mb-3" style="font-family:'Space Grotesk'">${course.title}</h1><p class="mb-4" style="color:var(--muted)">${course.description}</p>${enrolled?`<div class="flex items-center gap-4 mb-2"><div class="progress-bar flex-1" style="height:8px"><div class="progress-fill" style="width:${prog}%"></div></div><span class="font-bold" style="color:var(--primary)">${prog}%</span></div>`:`<button class="btn-primary" data-action="enroll" data-course-id="${course.id}">S'inscrire au cours</button>`}</div><div class="lg:w-80"><img src="${course.image}" alt="${course.title}" class="w-full rounded-xl" style="border:1px solid var(--border)" loading="lazy"></div></div></div>${enrolled?`<div class="grid lg:grid-cols-4 gap-6"><div class="lg:col-span-1 glass p-4"><h3 class="font-bold mb-3 text-sm" style="font-family:'Space Grotesk'">Leçons</h3><div class="space-y-2">${course.lessons.map(l=>{const isCompleted=completedLessons.includes(l.id);const isActive=currentLessonObj&&currentLessonObj.id===l.id;return`<div class="lesson-item ${isActive?'active':''} ${isCompleted?'completed':''}" data-action="select-lesson" data-lesson-id="${l.id}"><div class="lesson-icon" style="color:${isCompleted?'var(--success)':isActive?'var(--primary)':'var(--muted)'}"><i class="fas ${isCompleted?'fa-check-circle':l.type==='video'?'fa-play-circle':'fa-file-alt'}"></i></div><div class="flex-1 min-w-0"><div class="text-sm font-medium truncate">${l.title}</div><div class="text-xs" style="color:var(--muted)">${l.duration} · ${l.type==='video'?'Vidéo':'Texte'}</div></div></div>`}).join('')}</div><div class="mt-4 pt-4 border-t" style="border-color:var(--border)"><button class="btn-secondary w-full text-center text-sm" data-action="start-quiz" data-course-id="${course.id}"><i class="fas fa-question-circle mr-2"></i>Passer le quiz</button>${quizScore?`<div class="text-xs mt-2 text-center" style="color:var(--muted)">Meilleur score : <strong style="color:var(--primary)">${quizScore.best}%</strong></div>`:''}</div></div><div class="lg:col-span-3 space-y-4">${currentLessonObj?`<div class="glass p-6 lg:p-8"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-semibold px-3 py-1 rounded-full" style="background:${course.color}20;color:${course.color}">${currentLessonObj.type==='video'?'Vidéo':'Texte'}</span><span class="text-xs" style="color:var(--muted)"><i class="fas fa-clock mr-1"></i>${currentLessonObj.duration}</span></div><h2 class="text-xl font-bold mb-6" style="font-family:'Space Grotesk'">${currentLessonObj.title}</h2>${currentLessonObj.type==='video'?`<div class="video-container mb-6"><iframe src="https://www.youtube-nocookie.com/embed/${currentLessonObj.videoId}?rel=0" title="${currentLessonObj.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:''}<div style="color:var(--text);line-height:1.8;font-size:.95rem">${currentLessonObj.content}</div></div><div class="flex justify-between items-center"><button class="btn-secondary text-sm" data-action="prev-lesson" ${course.lessons.indexOf(currentLessonObj)===0?'disabled style="opacity:.4;cursor:not-allowed"':''}><i class="fas fa-arrow-left mr-2"></i>Précédente</button>${!completedLessons.includes(currentLessonObj.id)?`<button class="btn-primary text-sm" data-action="complete-lesson" data-course-id="${course.id}" data-lesson-id="${currentLessonObj.id}"><i class="fas fa-check mr-2"></i>Marquer comme terminée</button>`:`<span class="text-sm" style="color:var(--success)"><i class="fas fa-check-circle mr-1"></i>Terminée</span>`}<button class="btn-secondary text-sm" data-action="next-lesson" ${course.lessons.indexOf(currentLessonObj)===course.lessons.length-1?'disabled style="opacity:.4;cursor:not-allowed"':''}>Suivante<i class="fas fa-arrow-right ml-2"></i></button></div>`:'<p style="color:var(--muted)">Sélectionnez une leçon.</p>'}</div></div>`:''}</div>`}

function renderQuizView(){const course=COURSES.find(c=>c.id===state.currentCourse);if(!course)return'<p>Cours introuvable.</p>';if(!state.quizState)return`<div class="max-w-xl mx-auto text-center animate-in"><div class="glass p-8 lg:p-12"><div style="width:80px;height:80px;border-radius:20px;background:${course.color}20;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px"><i class="fas ${course.icon} text-3xl" style="color:${course.color}"></i></div><h2 class="text-2xl font-bold mb-3" style="font-family:'Space Grotesk'">Quiz : ${course.title}</h2><p class="mb-6" style="color:var(--muted)">${course.quiz.length} questions</p><button class="btn-primary" data-action="begin-quiz" data-course-id="${course.id}">Commencer</button><br><br><button class="btn-secondary text-sm" data-action="open-course" data-course-id="${course.id}">Retour</button></div></div>`;const qs=state.quizState;if(qs.finished){const score=Math.round((qs.correctCount/course.quiz.length)*100);return`<div class="max-w-xl mx-auto text-center animate-in"><div class="glass p-8 lg:p-12"><div style="width:100px;height:100px;border-radius:50%;background:${score>=70?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)'};display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse-glow 2s ease infinite"><i class="fas ${score>=70?'fa-trophy':'fa-redo'} text-4xl" style="color:${score>=70?'var(--success)':'var(--error)'}"></i></div><h2 class="text-2xl font-bold mb-2" style="font-family:'Space Grotesk'">${score>=70?'Félicitations !':'Continuez !'}</h2><p class="text-4xl font-bold mb-2" style="color:${score>=70?'var(--success)':'var(--accent)'};font-family:'Space Grotesk'">${score}%</p><p class="mb-6" style="color:var(--muted)">${qs.correctCount}/${course.quiz.length} bonnes réponses · +${Math.round(score*.5)} XP</p><div class="space-y-3 text-left mb-6">${course.quiz.map((q,i)=>{const isCorrect=qs.answers[i]===q.correct;return`<div class="p-4 rounded-xl" style="background:${isCorrect?'rgba(16,185,129,.08)':'rgba(239,68,68,.08)'};border:1px solid ${isCorrect?'rgba(16,185,129,.2)':'rgba(239,68,68,.2)'}"><div class="flex items-start gap-3"><i class="fas ${isCorrect?'fa-check-circle':'fa-times-circle'} mt-1" style="color:${isCorrect?'var(--success)':'var(--error)'}"></i><div><div class="text-sm font-semibold mb-1">${q.question}</div><div class="text-xs" style="color:var(--muted)">${isCorrect?'Correct !':'Votre réponse : '+q.options[qs.answers[i]]+' · Correcte : '+q.options[q.correct]}</div></div></div></div>`}).join('')}</div><div class="flex gap-3 justify-center"><button class="btn-primary" data-action="begin-quiz" data-course-id="${course.id}">Recommencer</button><button class="btn-secondary" data-action="open-course" data-course-id="${course.id}">Retour</button></div></div></div>`}const q=course.quiz[qs.current];const answered=qs.answers[qs.current]!==undefined;return`<div class="max-w-2xl mx-auto animate-in"><div class="mb-6"><div class="flex items-center justify-between mb-3"><span class="text-sm font-semibold" style="color:var(--muted)">Question ${qs.current+1}/${course.quiz.length}</span><button class="text-sm" style="color:var(--muted)" data-action="open-course" data-course-id="${course.id}">Quitter</button></div><div class="progress-bar" style="height:4px"><div class="progress-fill" style="width:${((qs.current+1)/course.quiz.length)*100}%"></div></div></div><div class="glass p-6 lg:p-8 mb-6"><h2 class="text-xl font-bold mb-6" style="font-family:'Space Grotesk'">${q.question}</h2><div class="space-y-3">${q.options.map((opt,i)=>{let cls='quiz-option';if(answered){if(i===q.correct)cls+=' correct';else if(i===qs.answers[qs.current]&&i!==q.correct)cls+=' wrong'}else if(qs.selectedOption===i)cls+=' selected';return`<div class="${cls}" data-action="select-option" data-option="${i}"><div class="circle">${answered&&i===q.correct?'<i class="fas fa-check text-xs" style="color:#fff"></i>':answered&&i===qs.answers[qs.current]&&i!==q.correct?'<i class="fas fa-times text-xs" style="color:#fff"></i>':''}</div><span class="text-sm">${opt}</span></div>`}).join('')}</div>${answered?`<div class="mt-4 p-4 rounded-xl text-sm" style="background:rgba(0,221,179,.06);border:1px solid rgba(0,221,179,.15)"><i class="fas fa-lightbulb mr-2" style="color:var(--gold)"></i>${q.explanation}</div>`:''}</div><div class="flex justify-end gap-3">${!answered?`<button class="btn-primary" data-action="confirm-answer" ${qs.selectedOption===null?'disabled style="opacity:.4;cursor:not-allowed"':''}>Valider</button>`:`<button class="btn-primary" data-action="next-question">${qs.current<course.quiz.length-1?'Question suivante':'Voir les résultats'}</button>`}</div></div>`}

function renderProgressView(){const p=getProgress(state.currentUser.username);const tl=getTotalLessonsCompleted(state.currentUser.username);const tp=COURSES.reduce((s,c)=>s+c.lessons.length,0);const avg=Object.values(p.quizScores).length?Math.round(Object.values(p.quizScores).reduce((s,q)=>s+q.best,0)/Object.values(p.quizScores).length):0;return `<div class="space-y-8 animate-in"><div class="grid grid-cols-2 lg:grid-cols-4 gap-4"><div class="glass p-5 text-center"><div class="text-3xl font-bold mb-1" style="color:var(--primary);font-family:'Space Grotesk'">${p.xp}</div><div class="text-sm" style="color:var(--muted)">XP total</div></div><div class="glass p-5 text-center"><div class="text-3xl font-bold mb-1" style="color:var(--accent);font-family:'Space Grotesk'">${p.enrolledCourses.length}</div><div class="text-sm" style="color:var(--muted)">Cours inscrits</div></div><div class="glass p-5 text-center"><div class="text-3xl font-bold mb-1" style="color:var(--gold);font-family:'Space Grotesk'">${tl}/${tp}</div><div class="text-sm" style="color:var(--muted)">Leçons</div></div><div class="glass p-5 text-center"><div class="text-3xl font-bold mb-1" style="color:#a855f7;font-family:'Space Grotesk'">${avg}%</div><div class="text-sm" style="color:var(--muted)">Score moyen</div></div></div><div class="grid lg:grid-cols-2 gap-6"><div class="glass p-6"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Progression</h3><canvas id="progress-radar" height="260"></canvas></div><div class="glass p-6"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Scores quiz</h3><canvas id="progress-quiz" height="260"></canvas></div></div><div><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Détail par cours</h3><div class="space-y-3">${p.enrolledCourses.length===0?'<div class="glass p-8 text-center"><p style="color:var(--muted)">Aucun cours commencé.</p><button class="btn-primary mt-4" data-nav="courses">Explorer</button></div>':''}${p.enrolledCourses.map(id=>{const c=COURSES.find(x=>x.id===id);if(!c)return'';const prog=getCourseProgress(state.currentUser.username,id);const qs=p.quizScores[id];const cl=(p.completedLessons[id]||[]).length;return`<div class="glass p-5 flex flex-col sm:flex-row sm:items-center gap-4 cursor-pointer" data-action="open-course" data-course-id="${c.id}"><div style="width:48px;height:48px;border-radius:14px;background:${c.color}20;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas ${c.icon} text-lg" style="color:${c.color}"></i></div><div class="flex-1 min-w:0"><div class="font-semibold mb-1">${c.title}</div><div class="flex items-center gap-4 text-xs" style="color:var(--muted)"><span>${cl}/${c.lessons.length} leçons</span>${qs?`<span>Quiz : ${qs.best}%</span>`:'<span>Quiz non tenté</span>'}</div><div class="progress-bar mt-2"><div class="progress-fill" style="width:${prog}%"></div></div></div><div class="text-right flex-shrink-0"><span class="text-xl font-bold" style="color:var(--primary);font-family:'Space Grotesk'">${prog}%</span></div></div>`}).join('')}</div></div><div><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Succès</h3><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">${ACHIEVEMENTS.map(a=>{const earned=p.achievements.includes(a.id);return`<div class="glass p-4 text-center ${earned?'':'opacity-30'}" style="${earned?`border-color:${a.color}30`:''}"><div style="width:48px;height:48px;border-radius:50%;background:${a.color}${earned?'20':'08'};display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="fas ${a.icon}" style="color:${earned?a.color:'var(--muted)'}"></i></div><div class="font-semibold text-xs">${a.title}</div><div class="text-xs mt-1" style="color:var(--muted)">${a.desc}</div></div>`}).join('')}</div></div></div>`}

function initProgressCharts(){const p=getProgress(state.currentUser.username);const rc=document.getElementById('progress-radar');if(rc&&p.enrolledCourses.length>0){new Chart(rc,{type:'radar',data:{labels:p.enrolledCourses.map(id=>{const c=COURSES.find(x=>x.id===id);return c?c.title.split(' ').slice(0,2).join(' '):''}),datasets:[{label:'Progression',data:p.enrolledCourses.map(id=>getCourseProgress(state.currentUser.username,id)),backgroundColor:'rgba(0,221,179,.15)',borderColor:'rgba(0,221,179,.8)',borderWidth:2,pointBackgroundColor:'rgba(0,221,179,1)',pointBorderColor:'#fff',pointBorderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{r:{beginAtZero:true,max:100,ticks:{color:'#7a8bb5',backdropColor:'transparent',stepSize:25},grid:{color:'rgba(30,45,74,.4)'},pointLabels:{color:'#7a8bb5',font:{size:10}}}}}})}const qc=document.getElementById('progress-quiz');if(qc&&Object.keys(p.quizScores).length>0){new Chart(qc,{type:'doughnut',data:{labels:Object.keys(p.quizScores).map(id=>{const c=COURSES.find(x=>x.id===parseInt(id));return c?c.title.split(' ').slice(0,2).join(' '):''}),datasets:[{data:Object.values(p.quizScores).map(q=>q.best),backgroundColor:['rgba(0,221,179,.7)','rgba(255,87,51,.7)','rgba(255,193,7,.7)','rgba(168,85,247,.7)','rgba(6,182,212,.7)','rgba(239,68,68,.7)'],borderColor:'transparent',borderWidth:2,borderRadius:4}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#7a8bb5',padding:12,font:{size:11}}}}}})}}

function renderSettingsView(){const isGoogle=state.currentUser.authProvider==='google';const email=state.currentUser.email||'Non renseigné';return `<div class="max-w-2xl mx-auto animate-in space-y-6"><div class="glass p-6"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Mon compte NeoLearn</h3><div class="flex items-center gap-4 mb-6"><div style="width:64px;height:64px;border-radius:50%;${isGoogle?'background:linear-gradient(135deg,#4285f4,#34a853)':'background:linear-gradient(135deg,var(--accent),#ff8c42)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;color:#fff">${state.currentUser.initial||state.currentUser.username[0].toUpperCase()}</div><div><div class="font-bold text-lg">${state.currentUser.username}</div><div class="flex items-center gap-2 text-sm" style="color:var(--muted)">${email} ${isGoogle?'<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:rgba(66,133,244,.1);color:#4285f4;font-size:.7rem;font-weight:600"><i class="fab fa-google" style="font-size:.6rem"></i>Google</span>':''}</div></div></div>${isGoogle?`<div class="p-4 rounded-xl mb-4" style="background:rgba(66,133,244,.06);border:1px solid rgba(66,133,244,.15)"><div class="flex items-center gap-2 mb-2"><i class="fab fa-google" style="color:#4285f4"></i><span class="font-semibold text-sm">Connecté via Google</span></div><p class="text-xs" style="color:var(--muted)">La gestion de votre compte passe par Google.</p></div>`:`<div class="p-4 rounded-xl mb-4" style="background:rgba(0,221,179,.06);border:1px solid rgba(0,221,179,.15)"><div class="flex items-center gap-2 mb-2"><i class="fas fa-shield-alt" style="color:var(--primary)"></i><span class="font-semibold text-sm">Compte NeoLearn</span></div><p class="text-xs" style="color:var(--muted)">Adresse e-mail vérifiée : ${email}</p></div>`}<div class="space-y-4"><div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Nom d'utilisateur</label><input type="text" class="input-field" value="${state.currentUser.username}" disabled style="opacity:.6"></div>${!isGoogle?`<div><label class="block text-sm font-medium mb-2" style="color:var(--muted)">Changer le mot de passe</label><input type="password" class="input-field" placeholder="Nouveau mot de passe" id="settings-new-pass"></div>`:''}<button class="btn-primary text-sm" data-action="save-settings">Sauvegarder</button></div></div><div class="glass p-6"><h3 class="font-bold text-lg mb-4" style="font-family:'Space Grotesk'">Données</h3><p class="text-sm mb-4" style="color:var(--muted)">Données stockées localement.</p><button class="btn-secondary text-sm" data-action="reset-progress"><i class="fas fa-redo mr-2"></i>Réinitialiser la progression</button></div></div>`}

function bindEvents(){const app=document.getElementById('app');app.removeEventListener('click',handleDelegatedClick);app.addEventListener('click',handleDelegatedClick);const lf=document.getElementById('login-form');if(lf)lf.onsubmit=handleLogin;const rf=document.getElementById('register-form');if(rf)rf.onsubmit=handleRegister;app.querySelectorAll('[data-action="search-input"]').forEach(el=>{el.oninput=e=>{state.searchQuery=e.target.value;if(state.currentView==='courses')render()}});const gsb=document.getElementById('google-signin-btn');if(gsb)gsb.onclick=showGoogleModal;const gub=document.getElementById('google-signup-btn');if(gub)gub.onclick=showGoogleModal}

function handleDelegatedClick(e){const target=e.target.closest('[data-action]')||e.target.closest('[data-nav]')||e.target.closest('[data-filter-cat]')||e.target.closest('[data-auth-tab]')||e.target.closest('[data-auth-switch]');if(!target)return;const nav=target.dataset.nav;const filterCat=target.dataset.filterCat;const authTab=target.dataset.authTab;const authSwitch=target.dataset.authSwitch;if(nav){e.preventDefault();state.currentView=nav;state.currentCourse=null;state.quizState=null;state.mobileSidebar=false;render();return}if(filterCat){state.categoryFilter=filterCat;render();return}if(authTab){document.querySelectorAll('#auth-tabs .tab-btn').forEach(b=>b.classList.remove('active'));target.classList.add('active');document.getElementById('login-form').style.display=authTab==='login'?'block':'none';document.getElementById('register-form').style.display=authTab==='register'?'block':'none';return}if(authSwitch){const lf=document.getElementById('login-form'),rf=document.getElementById('register-form'),tabs=document.querySelectorAll('#auth-tabs .tab-btn');if(authSwitch==='register'){lf.style.display='none';rf.style.display='block';tabs[0].classList.remove('active');tabs[1].classList.add('active')}else{lf.style.display='block';rf.style.display='none';tabs[0].classList.add('active');tabs[1].classList.remove('active')}return}const action=target.dataset.action;if(!action)return;switch(action){case'toggle-sidebar':state.mobileSidebar=!state.mobileSidebar;document.getElementById('sidebar')?.classList.toggle('mobile-open');break;case'logout':state.currentUser=null;state.currentView='login';state.currentCourse=null;state.quizState=null;localStorage.removeItem('neolearn_state');render();break;case'open-course':state.currentCourse=parseInt(target.dataset.courseId);state.currentLesson=null;state.quizState=null;state.currentView='courseDetail';render();break;case'enroll':enrollCourse(parseInt(target.dataset.courseId));render();break;case'select-lesson':state.currentLesson=parseInt(target.dataset.lessonId);render();break;case'complete-lesson':completeLesson(parseInt(target.dataset.courseId),parseInt(target.dataset.lessonId));render();break;case'prev-lesson':{const c=COURSES.find(x=>x.id===state.currentCourse);if(c){const i=c.lessons.findIndex(l=>l.id===state.currentLesson);if(i>0){state.currentLesson=c.lessons[i-1].id;render()}}break}case'next-lesson':{const c=COURSES.find(x=>x.id===state.currentCourse);if(c){const i=c.lessons.findIndex(l=>l.id===state.currentLesson);if(i<c.lessons.length-1){state.currentLesson=c.lessons[i+1].id;render()}}break}case'start-quiz':case'begin-quiz':state.currentCourse=parseInt(target.dataset.courseId);state.quizState={current:0,answers:[],selectedOption:null,correctCount:0,finished:false};state.currentView='quiz';render();break;case'select-option':if(state.quizState&&state.quizState.answers[state.quizState.current]===undefined){state.quizState.selectedOption=parseInt(target.dataset.option);render()}break;case'confirm-answer':{if(!state.quizState||state.quizState.selectedOption===null)break;const c=COURSES.find(x=>x.id===state.currentCourse);if(!c)break;const q=c.quiz[state.quizState.current];if(state.quizState.selectedOption===q.correct)state.quizState.correctCount++;state.quizState.answers[state.quizState.current]=state.quizState.selectedOption;state.quizState.selectedOption=null;render();break}case'next-question':{if(!state.quizState)break;const c=COURSES.find(x=>x.id===state.currentCourse);if(!c)break;if(state.quizState.current<c.quiz.length-1){state.quizState.current++;state.quizState.selectedOption=null}else{state.quizState.finished=true;const score=Math.round((state.quizState.correctCount/c.quiz.length)*100);saveQuizScore(state.currentCourse,score)}render();break}case'save-settings':{const np=document.getElementById('settings-new-pass');if(np&&np.value.trim().length>0&&np.value.trim().length<6){showToast('Mot de passe : 6+ caractères','error');return}if(np&&np.value.trim().length>=6){const users=JSON.parse(localStorage.getItem('neolearn_users')||'{}');if(users[state.currentUser.username]){users[state.currentUser.username].password=np.value.trim();localStorage.setItem('neolearn_users',JSON.stringify(users));showToast('Mot de passe mis à jour !')}}else{showToast('Sauvegardé !')}break}case'reset-progress':state.progress[state.currentUser.username]={enrolledCourses:[],completedLessons:{},quizScores:{},xp:0,achievements:[]};saveState();showToast('Progression réinitialisée','info');render();break}}

function handleLogin(e){e.preventDefault();const u=document.getElementById('login-user').value.trim();const p=document.getElementById('login-pass').value;if(!u||!p){showToast('Remplissez tous les champs.','error');return}const users=JSON.parse(localStorage.getItem('neolearn_users')||'{}');if(!users[u]){showToast('Compte introuvable.','error');return}if(users[u].authProvider==='google'){showToast('Utilisez le bouton Google.','info');return}if(users[u].password!==p){showToast('Mot de passe incorrect.','error');return}state.currentUser={username:u,authProvider:'local',email:users[u].email||''};state.currentView='dashboard';saveState();showToast(`Bienvenue, ${u} !`);render()}

function handleRegister(e){e.preventDefault();const em=document.getElementById('reg-email').value.trim();const u=document.getElementById('reg-user').value.trim();const p=document.getElementById('reg-pass').value;const pc=document.getElementById('reg-pass-confirm').value;const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;if(!em||!emailRegex.test(em)){showToast('Veuillez entrer une adresse e-mail valide et réelle.','error');return}if(!u||u.length<3){showToast('Identifiant : minimum 3 caractères.','error');return}if(p.length<6){showToast('Mot de passe : minimum 6 caractères.','error');return}if(p!==pc){showToast('Les mots de passe ne correspondent pas.','error');return}const users=JSON.parse(localStorage.getItem('neolearn_users')||'{}');if(users[u]){showToast('Cet identifiant est déjà pris.','error');return}users[u]={password:p,authProvider:'local',email:em};localStorage.setItem('neolearn_users',JSON.stringify(users));state.currentUser={username:u,authProvider:'local',email:em};state.currentView='dashboard';saveState();showToast('Compte NeoLearn créé avec succès !');render()}

loadState();render();
document.addEventListener('click',e=>{if(state.mobileSidebar&&!e.target.closest('#sidebar')&&!e.target.closest('[data-action="toggle-sidebar"]')){state.mobileSidebar=false;const sb=document.getElementById('sidebar');if(sb)sb.classList.remove('mobile-open')}});
</script>
</body>
</html>
